              public static void status(ServerPlayerEntity p) {
                  MallState st = MallState.get(p.getServer());
                  p.sendMessage(Text.literal("Ночь " + st.night + " • Долг: $" + st.debt + " • Смена идёт: " + (active ? "да" : "нет")
                          + " • Сон = смена: " + (st.autoSleep ? "вкл" : "выкл")).formatted(Formatting.GRAY), false);
              }

              // ================= смена =================

              private static void beginShift(ServerWorld mall, MallState st) {
                  active = true;
                  night = st.night;
                  shiftStart = now;
                  shiftEnd = now + SHIFT_TICKS;
                  satisfaction = 100;
                  earned = 0;
                  served = 0;
                  angry = 0;
                  solved = 0;
                  failed = 0;
                  customers.clear();
                  queue.clear();
                  anomalies.clear();
                  parcels.clear();
                  litter.clear();
                  java.util.Arrays.fill(stock, 2);
                  for (int i = 0; i < stock.length; i++) MallBuilder.refreshShelf(mall, i, stock[i]);
                  for (BlockPos d : MallBuilder.DOCK) mall.setBlockState(d, AIR, 3);
                  if (st.lightsOut) {
                      MallBuilder.setLights(mall, true);
                      st.lightsOut = false;
                      st.markDirty();
                  }
                  nextCustomer = now + 100;
                  nextAnomaly = now + 700 + RNG.nextInt(300);
                  nextParcel = now + 160;
                  nextLitter = now + 400;
                  bar = new ServerBossBar(Text.literal("Смена"), BossBar.Color.PURPLE, BossBar.Style.PROGRESS);
              }

              public static void endShift(boolean completed) {
                  endShift(completed, null);
              }

              public static void endShift(boolean completed, String reason) {
                  if (!active) return;
                  active = false;
                  MinecraftServer s = server;
                  ServerWorld mall = s.getWorld(MidnightMall.MALL);
                  MallState st = MallState.get(s);

                  for (Anomaly a : new ArrayList<>(anomalies)) cleanup(a, mall);
                  anomalies.clear();
                  if (mall != null) {
                      if (st.lightsOut) MallBuilder.setLights(mall, true);
                      for (Customer c : customers) {
                          if (!c.e.isRemoved()) c.e.discard();
                      }
                      for (BlockPos d : MallBuilder.DOCK) mall.setBlockState(d, AIR, 3);
                      for (BlockPos p : litter) {
                          if (mall.getBlockState(p).isOf(Blocks.BROWN_CARPET)) mall.setBlockState(p, AIR, 3);
                      }
                  }
                  st.lightsOut = false;
                  customers.clear();
                  queue.clear();
                  parcels.clear();
                  litter.clear();

                  int bonus = completed ? satisfaction * 60 / 100 : 0;
                  int penalty = completed ? 0 : 100;
                  st.debt = Math.max(0, st.debt - bonus) + penalty;
                  boolean won = st.debt <= 0;
                  int doneNight = night;
                  if (completed && !won) st.night = night + 1;

                  List<Text> report = new ArrayList<>();
                  if (completed) {
                      report.add(Text.literal("☀ Смена окончена (ночь " + doneNight + ").").formatted(Formatting.GOLD));
                  } else {
                      report.add(Text.literal("✖ Смена прервана. " + (reason == null ? "" : reason) + " Штраф: $100.").formatted(Formatting.RED));
                  }
                  report.add(Text.literal("Обслужено: " + served + " • недовольных: " + angry + " • аномалий отражено: " + solved
                          + ", пропущено: " + failed).formatted(Formatting.GRAY));
                  if (completed) report.add(Text.literal("Бонус за довольство покупателей: $" + bonus).formatted(Formatting.GRAY));
                  if (won) {
                      st.cycles++;
                      st.debt = 3000 + 600 * st.cycles;
                      st.night = 1;
                      report.add(Text.literal("★ ДОЛГ ВЫПЛАЧЕН. Ты свободен... но магазин ночью снова откроет двери (новый долг: $" + st.debt + ").")
                              .formatted(Formatting.GREEN, Formatting.BOLD));
                  } else {
                      report.add(Text.literal("Остаток долга: $" + st.debt).formatted(Formatting.YELLOW));
                  }
                  st.markDirty();

                  for (UUID id : new ArrayList<>(sanity.keySet())) {
                      ServerPlayerEntity p = s.getPlayerManager().getPlayer(id);
                      if (p == null) continue;
                      for (Text t : report) p.sendMessage(t, false);
                      leave(p);
                  }
                  sanity.clear();
                  returns.clear();
                  if (bar != null) bar.clearPlayers();

                  long t = s.getOverworld().getTimeOfDay() % 24000L;
                  if (t >= 12000L) {
                      s.getCommandManager().executeWithPrefix(s.getCommandSource().withSilent(), "time add " + (24000L - t + 1000L));
                  }
              }

              // ================= главный тик =================

              public static void tick(MinecraftServer s) {
                  server = s;
                  now++;

                  if (!sleepers.isEmpty()) {
                      List<UUID> due = new ArrayList<>();
                      for (Map.Entry<UUID, Integer> en : sleepers.entrySet()) {
                          if (now >= en.getValue()) due.add(en.getKey());
                      }
                      for (UUID id : due) {
                          sleepers.remove(id);
                          ServerPlayerEntity p = s.getPlayerManager().getPlayer(id);
                          if (p != null && p.isSleeping() && !inMall(p)) join(p);
                      }
                  }
                  if (!pendingLeave.isEmpty()) {
                      List<UUID> due = new ArrayList<>();
                      for (Map.Entry<UUID, Integer> en : pendingLeave.entrySet()) {
                          if (now >= en.getValue()) due.add(en.getKey());
                      }
                      for (UUID id : due) {
                          pendingLeave.remove(id);
                          ServerPlayerEntity p = s.getPlayerManager().getPlayer(id);
                          if (p != null && inMall(p) && !sanity.containsKey(id)) leave(p);
                      }
                  }

                  if (!active) return;
                  ServerWorld mall = s.getWorld(MidnightMall.MALL);
                  if (mall == null) {
                      endShift(false, "Измерение недоступно.");
                      return;
                  }
                  List<ServerPlayerEntity> ps = players();
                  if (ps.isEmpty() && now - shiftStart > 60) {
                      endShift(false, "Все ушли со смены.");
                      return;
                  }
                  MallState st = MallState.get(s);
                  if (st.debt <= 0) {
                      endShift(true);
                      return;
                  }
                  int left = shiftEnd - now;
                  if (left <= 0) {
                      endShift(true);
                      return;
                  }
                  for (int v : sanity.values()) {
                      if (v <= 0) {
                          endShift(false, "Вы потеряли сознание от страха.");
                          return;
                      }
                  }

                  if (now % 20 == 0) hud(ps, st, left);

                  if (now >= nextCustomer && customers.size() < 6) {
                      spawnCustomer(mall);
                      nextCustomer = now + Math.max(180, 380 - night * 25);
                  }
                  tickCustomers(mall);

                  if (now >= nextAnomaly) {
                      startRandomAnomaly(mall, ps);
                      nextAnomaly = now + Math.max(500, 1100 - night * 80) + RNG.nextInt(300);
                  }
                  tickAnomalies(mall, ps);

                  if (now >= nextParcel) {
                      spawnParcel(ps);
                      nextParcel = now + 900 + RNG.nextInt(400);
                  }
                  if (now >= nextLitter) {
                      spawnLitter(mall);
                      nextLitter = now + 500 + RNG.nextInt(400);
                  }
                  if (now % 20 == 0) tickSanity(mall, ps);
              }

              private static List<ServerPlayerEntity> players() {
                  List<ServerPlayerEntity> list = new ArrayList<>();
                  for (ServerPlayerEntity p : server.getPlayerManager().getPlayerList()) {
                      if (sanity.containsKey(p.getUuid()) && inMall(p)) list.add(p);
                  }
                  return list;
              }

              private static void broadcast(Text t, boolean overlay) {
                  for (ServerPlayerEntity p : players()) p.sendMessage(t, overlay);
              }

              private static void hud(List<ServerPlayerEntity> ps, MallState st, int left) {
                  int sec = left / 20;
                  bar.setName(Text.literal(String.format(Locale.ROOT, "Ночь %d  •  до конца смены %d:%02d", night, sec / 60, sec % 60)));
                  bar.setPercent(Math.max(0f, Math.min(1f, left / (float) SHIFT_TICKS)));
                  for (ServerPlayerEntity p : ps) {
                      int sn = sanity.getOrDefault(p.getUuid(), 0);
                      Formatting col = sn >= 60 ? Formatting.GREEN : (sn >= 30 ? Formatting.YELLOW : Formatting.RED);
                      p.sendMessage(Text.literal(String.format(Locale.ROOT, "Долг: $%d   Рассудок: %d%%   Довольство: %d%%",
                              st.debt, sn, satisfaction)).formatted(col), true);
                  }
              }

              // ================= экономика / рассудок =================

              private static void reward(int amount) {
                  MallState st = MallState.get(server);
                  st.debt = Math.max(0, st.debt - amount);
                  st.markDirty();
                  earned += amount;
              }

              private static void addDebt(int amount) {
                  MallState st = MallState.get(server);
                  st.debt += amount;
                  st.markDirty();
              }

              private static void changeSanity(int d) {
                  for (UUID id : new ArrayList<>(sanity.keySet())) {
                      int v = sanity.get(id) + d;
                      sanity.put(id, Math.max(0, Math.min(100, v)));
                  }
              }

              private static void tickSanity(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  boolean dark = has(AType.LIGHTS);
                  if (anomalies.isEmpty() && now % 100 == 0) changeSanity(1);
                  if (dark && now % 100 == 0) changeSanity(-2);
                  for (ServerPlayerEntity p : ps) {
                      int sn = sanity.getOrDefault(p.getUuid(), 100);
                      if (sn < 60 && RNG.nextInt(12) == 0) {
                          Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.AMBIENT_CAVE, 0.8f, 0.8f + RNG.nextFloat() * 0.4f);
                      }
                      if (sn < 40 && RNG.nextInt(25) == 0) {
                          p.addStatusEffect(new StatusEffectInstance(StatusEffects.DARKNESS, 60, 0, false, false, false));
                      }
                      if (sn < 25 && RNG.nextInt(30) == 0) {
                          p.addStatusEffect(new StatusEffectInstance(StatusEffects.NAUSEA, 100, 0, false, false, false));
                      }
                      p.getHungerManager().setFoodLevel(20);
                  }
              }

              // ================= покупатели =================

              private static Vec3d door() {
                  return RNG.nextBoolean() ? MallBuilder.DOOR_A : MallBuilder.DOOR_B;
              }

              private static Vec3d slot(int i) {
                  return new Vec3d(39.5, 64, 19.5 + Math.min(i, 5));
              }

              private static MallNpcEntity spawnNpc(ServerWorld mall, int variant, Vec3d at, float yaw) {
                  MallNpcEntity e = new MallNpcEntity(MallEntities.NPC, mall);
                  e.managed = true;
                  e.setVariant(variant);
                  e.refreshPositionAndAngles(at.x, at.y, at.z, yaw, 0f);
                  mall.spawnEntity(e);
                  return e;
              }

              private static void spawnCustomer(ServerWorld mall) {
                  Customer c = new Customer();
                  c.e = spawnNpc(mall, RNG.nextInt(2), door(), 90f);
                  c.state = ENTER;
                  customers.add(c);
              }

              private static Customer customerOf(Entity e) {
                  for (Customer c : customers) if (c.e == e) return c;
                  return null;
              }

              private static int pickShelf() {
                  List<Integer> ok = new ArrayList<>();
                  for (int i = 0; i < stock.length; i++) if (stock[i] > 0) ok.add(i);
                  if (ok.isEmpty()) return -1;
                  return ok.get(RNG.nextInt(ok.size()));
              }

              private static void angryLeave(Customer c) {
                  queue.remove(c);
                  c.state = LEAVE;
                  c.t = 0;
                  satisfaction = Math.max(0, satisfaction - 8);
                  angry++;
                  broadcast(Text.literal("Покупатель ушёл недовольным.").formatted(Formatting.RED), true);
              }

              private static void tickCustomers(ServerWorld mall) {
                  for (Customer c : new ArrayList<>(customers)) {
                      if (c.e.isRemoved()) {
                          queue.remove(c);
                          customers.remove(c);
                          continue;
                      }
                      c.t++;
                      switch (c.state) {
                          case ENTER -> {
                              c.shelf = pickShelf();
                              if (c.shelf < 0) {
                                  angryLeave(c);
                              } else {
                                  c.state = SHOP;
                                  c.t = 0;
                              }
                          }
                          case SHOP -> {
                              Vec3d a = MallBuilder.SHELVES.get(c.shelf).approach();
                              if (c.t % 15 == 1) c.e.getNavigation().startMovingTo(a.x, a.y, a.z, 1.0);
                              if (c.e.squaredDistanceTo(a.x, a.y, a.z) < 2.5) {
                                  c.state = BROWSE;
                                  c.t = 0;
                              } else if (c.t > 700) {
                                  angryLeave(c);
                              }
                          }
                          case BROWSE -> {
                              MallBuilder.Shelf sh = MallBuilder.SHELVES.get(c.shelf);
                              c.e.getLookControl().lookAt(sh.x1() + (sh.x2() - sh.x1() + 1) / 2.0, 65, sh.z() + 0.5);
                              if (c.t >= 50) {
                                  if (stock[c.shelf] > 0) {
                                      stock[c.shelf]--;
                                      MallBuilder.refreshShelf(mall, c.shelf, stock[c.shelf]);
                                      c.state = QUEUE;
                                      c.t = 0;
                                      queue.add(c);
                                  } else {
                                      c.shelf = pickShelf();
                                      if (c.shelf < 0) {
                                          angryLeave(c);
                                      } else {
                                          c.state = SHOP;
                                          c.t = 0;
                                      }
                                  }
                              }
                          }
                          case QUEUE -> {
                              int idx = queue.indexOf(c);
                              if (idx < 0) {
                                  c.state = LEAVE;
                                  c.t = 0;
                                  break;
                              }
                              Vec3d q = slot(idx);
                              if (c.t % 10 == 1 && c.e.squaredDistanceTo(q.x, q.y, q.z) > 0.6) {
                                  c.e.getNavigation().startMovingTo(q.x, q.y, q.z, 1.0);
                              }
                              if (idx == 0 && c.e.squaredDistanceTo(q.x, q.y, q.z) < 2.0) {
                                  c.e.getLookControl().lookAt(39.5, 65.5, 18.5);
                              }
                              if (!c.faceless) {
                                  c.patience++;
                                  if (c.patience > 1000) angryLeave(c);
                              }
                          }
                          case LEAVE -> {
                              Vec3d d = MallBuilder.DOOR_A;
                              if (c.t % 15 == 1) c.e.getNavigation().startMovingTo(d.x, d.y, d.z, 1.2);
                              if (c.e.squaredDistanceTo(d.x, d.y, d.z) < 12 || c.t > 900) c.e.discard();
                          }
                          default -> {
                          }
                      }
                  }
              }

              // ================= взаимодействие игрока =================

              public static void useBlock(ServerPlayerEntity p, ServerWorld w, BlockPos pos) {
                  if (pos.equals(MallBuilder.REGISTER)) {
                      serve(p, w);
                      return;
                  }
                  if (pos.equals(MallBuilder.PHONE)) {
                      phone(p, w);
                      return;
                  }
                  for (BlockPos b : MallBuilder.BREAKER) {
                      if (pos.equals(b)) {
                          breaker(p, w);
                          return;
                      }
                  }
                  for (int i = 0; i < MallBuilder.SHELVES.size(); i++) {
                      if (MallBuilder.SHELVES.get(i).contains(pos)) {
                          shelfUse(p, w, i);
                          return;
                      }
                  }
                  if (parcels.contains(pos)) {
                      w.setBlockState(pos, AIR, 3);
                      parcels.remove(pos);
                      p.getInventory().offerOrDrop(new ItemStack(MallItems.GOODS_BOX, 3));
                      Fx.sound(w, pos.getX() + 0.5, pos.getY(), pos.getZ() + 0.5, SoundEvents.ENTITY_ITEM_PICKUP, 1f, 1f);
                      p.sendMessage(Text.literal("Вы забрали посылку: +3 коробки товара.").formatted(Formatting.GREEN), true);
                      return;
                  }
                  Anomaly cursed = anomalyAt(AType.PARCEL, pos);
                  if (cursed != null) {
                      p.sendMessage(Text.literal("Вы открыли красную посылку... зря.").formatted(Formatting.DARK_RED), false);
                      resolve(cursed, false, w);
                  }
              }

              public static void attackBlock(ServerPlayerEntity p, ServerWorld w, BlockPos pos) {
                  if (!active) return;
                  Anomaly cursed = anomalyAt(AType.PARCEL, pos);
                  if (cursed != null) {
                      resolve(cursed, true, w);
                      return;
                  }
                  if (w.getBlockState(pos).isOf(Blocks.BROWN_CARPET)) {
                      w.setBlockState(pos, AIR, 3);
                      litter.remove(pos);
                      reward(4);
                      p.sendMessage(Text.literal("Мусор убран. +$4").formatted(Formatting.GREEN), true);
                  }
              }

              public static void hitNpc(ServerPlayerEntity p, MallNpcEntity npc) {
                  if (!active) return;
                  ServerWorld w = p.getServerWorld();
                  Customer c = customerOf(npc);
                  Anomaly a = anomalyOfEnt(npc);
                  if (a != null && a.type == AType.FACELESS) {
                      resolve(a, true, w);
                      return;
                  }
                  if (a != null && a.type == AType.WATCHER) {
                      p.sendMessage(Text.literal("Оно не реагирует на удары. Смотри на него.").formatted(Formatting.GRAY), true);
                      return;
                  }
                  if (c != null) {
                      satisfaction = Math.max(0, satisfaction - 5);
                      p.sendMessage(Text.literal("Не бейте покупателей!").formatted(Formatting.RED), true);
                  }
              }

              private static void serve(ServerPlayerEntity p, ServerWorld w) {
                  if (!active) {
                      p.sendMessage(Text.literal("Касса не работает: смена не идёт.").formatted(Formatting.GRAY), true);
                      return;
                  }
                  Customer c = queue.isEmpty() ? null : queue.get(0);
                  Vec3d s0 = slot(0);
                  if (c == null || c.state != QUEUE || c.e.squaredDistanceTo(s0.x, s0.y, s0.z) > 6.0) {
                      p.sendMessage(Text.literal("У кассы никого нет.").formatted(Formatting.GRAY), true);
                      return;
                  }
                  if (c.faceless) {
                      Anomaly a = anomalyOfEnt(c.e);
                      p.sendMessage(Text.literal("Вы обслужили то, что не должно ничего покупать...").formatted(Formatting.DARK_RED), false);
                      if (a != null) {
                          resolve(a, false, w);
                      } else {
                          queue.remove(c);
                          c.e.discard();
                          changeSanity(-20);
                          addDebt(40);
                      }
                      return;
                  }
                  int pay = 12 + RNG.nextInt(11) + (c.patience < 300 ? 5 : 0);
                  reward(pay);
                  served++;
                  satisfaction = Math.min(100, satisfaction + 3);
                  queue.remove(c);
                  c.state = LEAVE;
                  c.t = 0;
                  MallState st = MallState.get(server);
                  p.sendMessage(Text.literal("+$" + pay + "   Долг: $" + st.debt).formatted(Formatting.GREEN), true);
                  Fx.sound(w, c.e.getX(), c.e.getY(), c.e.getZ(), SoundEvents.ENTITY_EXPERIENCE_ORB_PICKUP, 1f, 1.2f);
                  w.spawnParticles(ParticleTypes.HAPPY_VILLAGER, c.e.getX(), c.e.getY() + 1.5, c.e.getZ(), 5, 0.3, 0.3, 0.3, 0.02);
              }

              private static void shelfUse(ServerPlayerEntity p, ServerWorld w, int i) {
                  ItemStack held = p.getMainHandStack();
                  if (held.isOf(MallItems.GOODS_BOX)) {
                      if (stock[i] >= 4) {
                          p.sendMessage(Text.literal("Полка уже полная.").formatted(Formatting.GRAY), true);
                      } else {
                          held.decrement(1);
                          stock[i] = 4;
                          MallBuilder.refreshShelf(w, i, 4);
                          Fx.sound(w, p.getX(), p.getY(), p.getZ(), SoundEvents.ENTITY_ITEM_PICKUP, 1f, 0.8f);
                          p.sendMessage(Text.literal("Полка пополнена (4/4).").formatted(Formatting.GREEN), true);
                      }
                  } else {
                      p.sendMessage(Text.literal("Полка: " + stock[i] + "/4. Нужна коробка товара (их привозят в подвал).")
                              .formatted(Formatting.GRAY), true);
                  }
              }

              private static final String[] CALLS = {
                      "…Они уже в магазине. Не смотри им в лицо… если оно есть.",
                      "Тот, у кого нет лица, никогда ничего не покупает. Не пробивай его.",
                      "Красные посылки не открывай. Разбей, пока они не открылись сами.",
                      "Если погаснет свет, иди вниз. Щиток на южной стене подвала.",
                      "Если за спиной кто-то стоит, смотри на него. Не отводи взгляд. Только так.",
                      "Ты хорошо работаешь. Оставайся подольше. Мы никому не скажем.",
                      "…дыхание в трубке… и тихий смех."
              };

              private static void phone(ServerPlayerEntity p, ServerWorld w) {
                  Anomaly a = firstOf(AType.PHONE);
                  if (a != null) {
                      p.sendMessage(Text.literal("☎ «" + CALLS[RNG.nextInt(CALLS.length)] + "»").formatted(Formatting.DARK_PURPLE), false);
                      resolve(a, true, w);
                  } else {
                      p.sendMessage(Text.literal("Телефон молчит.").formatted(Formatting.GRAY), true);
                  }
              }

              private static void breaker(ServerPlayerEntity p, ServerWorld w) {
                  Anomaly a = firstOf(AType.LIGHTS);
                  if (a != null) {
                      resolve(a, true, w);
                  } else {
                      p.sendMessage(Text.literal("Щиток в порядке.").formatted(Formatting.GRAY), true);
                  }
              }

              // ================= посылки и мусор =================

              private static BlockPos freeDock(ServerWorld mall) {
                  List<BlockPos> spots = new ArrayList<>();
                  Collections.addAll(spots, MallBuilder.DOCK);
                  Collections.shuffle(spots, RNG);
                  for (BlockPos b : spots) {
                      if (mall.getBlockState(b).isAir() && !parcels.contains(b)) return b;
                  }
                  return null;
              }

              private static int freeDockCount(ServerWorld mall) {
                  int n = 0;
                  for (BlockPos b : MallBuilder.DOCK) if (mall.getBlockState(b).isAir()) n++;
                  return n;
              }

              private static void spawnParcel(List<ServerPlayerEntity> ps) {
                  ServerWorld mall = server.getWorld(MidnightMall.MALL);
                  if (mall == null || freeDockCount(mall) < 2) return;
                  BlockPos b = freeDock(mall);
                  if (b == null) return;
                  mall.setBlockState(b, Blocks.BARREL.getDefaultState(), 3);
                  parcels.add(b);
                  broadcast(Text.literal("📦 В подвал пришла посылка.").formatted(Formatting.AQUA), true);
              }

              private static void spawnLitter(ServerWorld mall) {
                  if (litter.size() >= 8) return;
                  for (int tries = 0; tries < 10; tries++) {
                      int x;
                      int z;
                      if (RNG.nextBoolean()) {
                          x = 14 + RNG.nextInt(52);
                          z = 24 + RNG.nextInt(12);
                      } else {
                          x = 30 + RNG.nextInt(20);
                          z = 3 + RNG.nextInt(19);
                      }
                      BlockPos p = new BlockPos(x, 64, z);
                      if (mall.getBlockState(p).isAir() && mall.getBlockState(p.down()).isSolidBlock(mall, p.down())) {
                          mall.setBlockState(p, Blocks.BROWN_CARPET.getDefaultState(), 3);
                          litter.add(p);
                          return;
                      }
                  }
              }

              // ================= аномалии =================

              private static boolean has(AType t) {
                  return firstOf(t) != null;
              }

              private static Anomaly firstOf(AType t) {
                  for (Anomaly a : anomalies) if (a.type == t) return a;
                  return null;
              }

              private static Anomaly anomalyAt(AType t, BlockPos pos) {
                  for (Anomaly a : anomalies) if (a.type == t && a.pos != null && a.pos.equals(pos)) return a;
                  return null;
              }

              private static Anomaly anomalyOfEnt(Entity e) {
                  for (Anomaly a : anomalies) if (a.ent == e) return a;
                  return null;
              }

              public static boolean forceAnomaly(String name) {
                  if (!active) return false;
                  ServerWorld mall = server.getWorld(MidnightMall.MALL);
                  if (mall == null) return false;
                  for (AType t : AType.values()) {
                      if (t.name().equalsIgnoreCase(name)) {
                          if (has(t)) return false;
                          return startAnomaly(t, mall, players());
                      }
                  }
                  return false;
              }

              private static void startRandomAnomaly(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  int maxActive = night >= 5 ? 2 : 1;
                  if (anomalies.size() >= maxActive || ps.isEmpty()) return;
                  List<AType> pool = new ArrayList<>();
                  pool.add(AType.LIGHTS);
                  pool.add(AType.PHONE);
                  pool.add(AType.PARCEL);
                  if (night >= 2) pool.add(AType.FACELESS);
                  if (night >= 3) pool.add(AType.WATCHER);
                  pool.removeIf(MallManager::has);
                  if (pool.isEmpty()) return;
                  startAnomaly(pool.get(RNG.nextInt(pool.size())), mall, ps);
              }

              private static boolean startAnomaly(AType t, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  Anomaly a = new Anomaly();
                  a.type = t;
                  a.start = now;
                  switch (t) {
                      case LIGHTS -> {
                          a.deadline = now + 1500;
                          MallBuilder.setLights(mall, false);
                          MallState st = MallState.get(server);
                          st.lightsOut = true;
                          st.markDirty();
                          broadcast(Text.literal("⚡ Погас свет! Щиток в подвале, у южной стены.").formatted(Formatting.YELLOW), false);
                          for (ServerPlayerEntity p : ps) {
                              Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.BLOCK_BEACON_DEACTIVATE, 1f, 0.7f);
                          }
                      }
                      case PHONE -> {
                          a.deadline = now + 700;
                          broadcast(Text.literal("☎ За кассой звонит телефон...").formatted(Formatting.LIGHT_PURPLE), true);
                      }
                      case PARCEL -> {
                          BlockPos spot = freeDock(mall);
                          if (spot == null) return false;
                          a.pos = spot;
                          a.deadline = now + 1800;
                          mall.setBlockState(spot, Blocks.NETHER_WART_BLOCK.getDefaultState(), 3);
                          broadcast(Text.literal("📦 В подвале появилась красная посылка.").formatted(Formatting.RED), true);
                      }
                      case FACELESS -> {
                          a.deadline = now + 1800;
                          a.ent = spawnNpc(mall, 2, door(), 90f);
                          Customer c = new Customer();
                          c.e = a.ent;
                          c.faceless = true;
                          c.state = QUEUE;
                          customers.add(c);
                          queue.add(c);
                          broadcast(Text.literal("Один из покупателей выглядит... неправильно.").formatted(Formatting.DARK_GRAY), true);
                      }
                      case WATCHER -> {
                          a.deadline = Integer.MAX_VALUE;
                          ServerPlayerEntity target = ps.get(RNG.nextInt(ps.size()));
                          Vec3d spot = pickWatchSpot(target);
                          a.ent = spawnNpc(mall, 3, spot, 0f);
                          Fx.sound(mall, target.getX(), target.getY(), target.getZ(), SoundEvents.ENTITY_ENDERMAN_STARE, 0.6f, 0.5f);
                      }
                  }
                  anomalies.add(a);
                  return true;
              }

              private static Vec3d pickWatchSpot(ServerPlayerEntity p) {
                  Vec3d[] spots = MallBuilder.WATCH_SPOTS[MallBuilder.floorOf(p.getY())];
                  List<Vec3d> far = new ArrayList<>();
                  Vec3d best = spots[0];
                  double bestD = -1;
                  for (Vec3d s : spots) {
                      double d = s.distanceTo(p.getPos());
                      if (d >= 16) far.add(s);
                      if (d > bestD) {
                          bestD = d;
                          best = s;
                      }
                  }
                  return far.isEmpty() ? best : far.get(RNG.nextInt(far.size()));
              }

              private static boolean looking(ServerPlayerEntity p, Entity e) {
                  Vec3d eye = p.getEyePos();
                  Vec3d target = e.getEyePos();
                  Vec3d to = target.subtract(eye);
                  if (to.length() > 48) return false;
                  if (p.getRotationVec(1.0f).dotProduct(to.normalize()) < 0.88) return false;
                  BlockHitResult r = p.getServerWorld().raycast(new RaycastContext(
                          eye, target, RaycastContext.ShapeType.COLLIDER, RaycastContext.FluidHandling.NONE, p));
                  return r.getType() == HitResult.Type.MISS;
              }

              private static void tickAnomalies(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  for (Anomaly a : new ArrayList<>(anomalies)) {
                      if (!anomalies.contains(a)) continue;
                      switch (a.type) {
                          case LIGHTS -> {
                              if (now % 20 == 0) {
                                  BlockPos b = MallBuilder.BREAKER[1];
                                  mall.spawnParticles(ParticleTypes.ELECTRIC_SPARK, b.getX() + 0.5, b.getY() + 1.2, b.getZ() + 0.5, 8, 0.3, 0.3, 0.3, 0.05);
                                  Fx.sound(mall, b.getX() + 0.5, b.getY(), b.getZ() + 0.5, SoundEvents.BLOCK_REDSTONE_TORCH_BURNOUT, 0.8f, 1.2f);
                              }
                              if (now >= a.deadline) resolve(a, false, mall);
                          }
                          case PHONE -> {
                              if (now % 40 == 0) {
                                  BlockPos b = MallBuilder.PHONE;
                                  Fx.sound(mall, b.getX() + 0.5, b.getY(), b.getZ() + 0.5, SoundEvents.BLOCK_BELL_USE, 1.5f, 1.4f);
                                  mall.spawnParticles(ParticleTypes.NOTE, b.getX() + 0.5, b.getY() + 1.2, b.getZ() + 0.5, 2, 0.3, 0.2, 0.3, 0.0);
                              }
                              if (now >= a.deadline) resolve(a, false, mall);
                          }
                          case PARCEL -> {
                              if (now % 10 == 0) {
                                  mall.spawnParticles(ParticleTypes.SOUL, a.pos.getX() + 0.5, a.pos.getY() + 1.1, a.pos.getZ() + 0.5, 2, 0.25, 0.25, 0.25, 0.01);
                              }
                              if (now % 100 == 0) {
                                  Fx.sound(mall, a.pos.getX() + 0.5, a.pos.getY(), a.pos.getZ() + 0.5, SoundEvents.ENTITY_VEX_AMBIENT, 0.9f, 0.6f);
                              }
                              if (now >= a.deadline) resolve(a, false, mall);
                          }
                          case FACELESS -> {
                              if (a.ent == null || a.ent.isRemoved()) {
                                  anomalies.remove(a);
                              } else if (now >= a.deadline) {
                                  resolve(a, false, mall);
                              }
                          }
                          case WATCHER -> tickWatcher(a, mall, ps);
                      }
                  }
              }

              private static void tickWatcher(Anomaly a, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (a.ent == null || a.ent.isRemoved() || ps.isEmpty()) {
                      anomalies.remove(a);
                      return;
                  }
                  ServerPlayerEntity nearest = ps.get(0);
                  for (ServerPlayerEntity p : ps) {
                      if (p.squaredDistanceTo(a.ent) < nearest.squaredDistanceTo(a.ent)) nearest = p;
                  }
                  boolean seen = false;
                  for (ServerPlayerEntity p : ps) {
                      if (looking(p, a.ent)) {
                          seen = true;
                          break;
                      }
                  }
                  a.ent.getLookControl().lookAt(nearest);
                  if (seen) {
                      a.watched++;
                      a.ent.getNavigation().stop();
                      a.ent.getMoveControl().moveTo(a.ent.getX(), a.ent.getY(), a.ent.getZ(), 0.0);
                      if (a.watched % 30 == 0) {
                          Fx.sound(mall, nearest.getX(), nearest.getY(), nearest.getZ(), SoundEvents.ENTITY_WARDEN_HEARTBEAT, 1f, 1f);
                      }
                      if (a.watched >= 120) {
                          resolve(a, true, mall);
                          return;
                      }
                  } else if (now % 6 == 0) {
                      a.ent.getNavigation().startMovingTo(nearest, 1.5);
                  }
                  if (a.ent.squaredDistanceTo(nearest) < 5.0) {
                      resolve(a, false, mall);
                  }
              }

              private static void resolve(Anomaly a, boolean ok, ServerWorld mall) {
                  if (!anomalies.remove(a)) return;
                  cleanup(a, mall);
                  if (ok) {
                      solved++;
                      reward(20);
                      changeSanity(8);
                      broadcast(Text.literal("✔ " + a.type.title + ": вы справились. +$20").formatted(Formatting.GREEN), true);
                      for (ServerPlayerEntity p : players()) {
                          Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.BLOCK_BEACON_ACTIVATE, 0.8f, 1.4f);
                      }
                  } else {
                      failed++;
                      int fine = switch (a.type) {
                          case LIGHTS, PARCEL -> 30;
                          case FACELESS -> 40;
                          case WATCHER -> 25;
                          default -> 0;
                      };
                      int sanityLoss = switch (a.type) {
                          case LIGHTS, PARCEL -> 25;
                          case FACELESS -> 20;
                          case WATCHER -> 30;
                          default -> 15;
                      };
                      changeSanity(-sanityLoss);
                      if (fine > 0) addDebt(fine);
                      broadcast(Text.literal("✖ " + a.type.title + ": вы не успели." + (fine > 0 ? " Штраф $" + fine : "")).formatted(Formatting.RED), true);
                      for (ServerPlayerEntity p : players()) {
                          Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.ENTITY_ENDERMAN_SCREAM, 0.7f, 0.6f);
                          if (a.type == AType.WATCHER) {
                              p.addStatusEffect(new StatusEffectInstance(StatusEffects.DARKNESS, 120, 0, false, false, false));
                          }
                      }
                      if (a.type == AType.PARCEL && night >= 2 && !has(AType.WATCHER)) {
                          startAnomaly(AType.WATCHER, mall, players());
                      }
                  }
              }

              private static void cleanup(Anomaly a, ServerWorld mall) {
                  switch (a.type) {
                      case LIGHTS -> {
                          if (mall != null) MallBuilder.setLights(mall, true);
                          MallState st = MallState.get(server);
                          st.lightsOut = false;
                          st.markDirty();
                      }
                      case PARCEL -> {
                          if (mall != null && a.pos != null) mall.setBlockState(a.pos, AIR, 3);
                      }
                      case FACELESS, WATCHER -> {
                          if (a.ent != null && !a.ent.isRemoved()) {
                              if (mall != null) {
                                  mall.spawnParticles(ParticleTypes.LARGE_SMOKE, a.ent.getX(), a.ent.getY() + 1, a.ent.getZ(), 15, 0.3, 0.6, 0.3, 0.02);
                              }
                              Customer c = customerOf(a.ent);
                              if (c != null) queue.remove(c);
                              a.ent.discard();
                          }
                      }
                      default -> {
                      }
                  }
              }
          }
