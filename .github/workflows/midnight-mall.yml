                          "§5§l— ПРАВИЛА НОЧНОЙ СМЕНЫ —",
                          "§71. §fПокупатели берут товар с полок и встают в очередь. Пробивай их: §eПКМ по кассе§f (кафедра на прилавке).",
                          "§72. §fПустую полку пополняй: §eПКМ по полке с коробкой товара§f.",
