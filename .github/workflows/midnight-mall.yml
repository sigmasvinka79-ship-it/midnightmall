                      return;
                  }
                  SpawnGroup g = e.getType().getSpawnGroup();
                  if (g == SpawnGroup.MONSTER || g == SpawnGroup.AMBIENT) e.discard();
              }

              public static boolean inMall(ServerPlayerEntity p) {
                  return p.getServerWorld().getRegistryKey().equals(MidnightMall.MALL);
              }

              // ================= вход / выход =================

              public static void join(ServerPlayerEntity p) {
                  if (server == null) server = p.getServer();
                  ServerWorld mall = server.getWorld(MidnightMall.MALL);
                  if (mall == null) {
                      p.sendMessage(Text.literal("Измерение торгового центра не загружено.").formatted(Formatting.RED), false);
                      return;
                  }
                  MallState st = MallState.get(server);
                  if (!st.generated) {
                      p.sendMessage(Text.literal("Строю торговый центр, подождите несколько секунд...").formatted(Formatting.GRAY), false);
                      MallBuilder.build(mall);
                      st.generated = true;
                      st.markDirty();
