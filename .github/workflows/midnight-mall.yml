                  if (!active) beginShift(mall, st);

                  returns.put(p.getUuid(), new Return(p.getServerWorld().getRegistryKey(),
                          p.getX(), p.getY(), p.getZ(), p.getYaw(), p.getPitch()));
                  sanity.put(p.getUuid(), 100);
                  if (p.isSleeping()) p.wakeUp(false, true);
                  tp(p, MidnightMall.MALL, MallBuilder.SPAWN.x, MallBuilder.SPAWN.y, MallBuilder.SPAWN.z, 0f, 0f);
                  bar.addPlayer(p);
                  p.getInventory().offerOrDrop(new ItemStack(MallItems.GOODS_BOX, 2));

                  p.sendMessage(Text.literal("☾ Ночь " + night + ". Вы просыпаетесь за кассой. Долг: $" + st.debt)
                          .formatted(Formatting.DARK_PURPLE), false);
                  if (night <= 2) rules(p);
                  else p.sendMessage(Text.literal("Правила смены: /mall rules").formatted(Formatting.GRAY), false);
              }

              public static void leave(ServerPlayerEntity p) {
                  Return r = returns.remove(p.getUuid());
                  sanity.remove(p.getUuid());
                  if (bar != null) bar.removePlayer(p);
                  if (r != null) {
                      tp(p, r.dim(), r.x(), r.y(), r.z(), r.yaw(), r.pitch());
                  } else {
                      BlockPos sp = server.getOverworld().getSpawnPos();
                      tp(p, World.OVERWORLD, sp.getX() + 0.5, sp.getY(), sp.getZ() + 0.5, 0f, 0f);
                  }
              }

              private static void tp(ServerPlayerEntity p, RegistryKey<World> dim, double x, double y, double z, float yaw, float pitch) {
                  String cmd = String.format(Locale.ROOT, "execute in %s run tp %s %.2f %.2f %.2f %.1f %.1f",
                          dim.getValue(), p.getUuidAsString(), x, y, z, yaw, pitch);
                  server.getCommandManager().executeWithPrefix(server.getCommandSource().withSilent(), cmd);
              }

              public static void rules(ServerPlayerEntity p) {
