                          "§77. §fПокупателя без лица §cне обслуживай§f. Прогони §eударом§f.",
                          "§78. §fЕсли за спиной появилась фигура, §eсмотри на неё§f, пока не исчезнет.",
                          "§79. §fЗвонит телефон за кассой? §eПКМ по телефону§f (колокол). Ответь.",
