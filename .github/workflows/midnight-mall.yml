name: Build Midnight Mall

# Один файл на весь мод: положи его в .github/workflows/midnight-mall.yml
# и запусти вкладку Actions -> Build Midnight Mall -> Run workflow.
# Готовый jar появится в Artifacts (MidnightMall).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/midnight-mall.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write project (gradle + resources)
        run: |
          set -e
          mkdir -p _mall && cd _mall
          mkdir -p src/main/java/com/midnightmall
          mkdir -p src/main/resources/data/midnightmall/dimension
          mkdir -p src/main/resources/data/midnightmall/dimension_type
          mkdir -p src/main/resources/assets/midnightmall/lang
          mkdir -p src/main/resources/assets/midnightmall/models/item
          cat > build.gradle <<'MALL_EOF_7Q'
          plugins {
              id 'fabric-loom' version '1.8-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          MALL_EOF_7Q
          cat > settings.gradle <<'MALL_EOF_7Q'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'midnightmall'
          MALL_EOF_7Q
          cat > src/main/resources/assets/midnightmall/lang/en_us.json <<'MALL_EOF_7Q'
          {
            "item.midnightmall.goods_box": "Box of Goods"
          }
          MALL_EOF_7Q
          cat > src/main/resources/assets/midnightmall/lang/ru_ru.json <<'MALL_EOF_7Q'
          {
            "item.midnightmall.goods_box": "Коробка товара"
          }
          MALL_EOF_7Q
          cat > src/main/resources/assets/midnightmall/models/item/goods_box.json <<'MALL_EOF_7Q'
          {
            "parent": "minecraft:block/barrel"
          }
          MALL_EOF_7Q
          cat > src/main/resources/data/midnightmall/dimension/mall.json <<'MALL_EOF_7Q'
          {
            "type": "midnightmall:mall",
            "generator": {
              "type": "minecraft:flat",
              "settings": {
                "biome": "minecraft:the_void",
                "features": false,
                "lakes": false,
                "layers": [
                  { "block": "minecraft:air", "height": 1 }
                ],
                "structure_overrides": []
              }
            }
          }
          MALL_EOF_7Q
          cat > src/main/resources/data/midnightmall/dimension_type/mall.json <<'MALL_EOF_7Q'
          {
            "ultrawarm": false,
            "natural": false,
            "coordinate_scale": 1.0,
            "has_skylight": false,
            "has_ceiling": true,
            "ambient_light": 0.0,
            "fixed_time": 18000,
            "monster_spawn_light_level": 0,
            "monster_spawn_block_light_limit": 0,
            "piglin_safe": false,
            "bed_works": false,
            "respawn_anchor_works": false,
            "has_raids": false,
            "logical_height": 128,
            "min_y": 0,
            "height": 128,
            "infiniburn": "#minecraft:infiniburn_overworld",
            "effects": "minecraft:overworld"
          }
          MALL_EOF_7Q
          cat > src/main/resources/fabric.mod.json <<'MALL_EOF_7Q'
          {
            "schemaVersion": 1,
            "id": "midnightmall",
            "version": "${version}",
            "name": "Midnight Mall",
            "description": "Каждую ночь вы засыпаете и просыпаетесь на смене в огромном торговом центре. Обслуживайте покупателей, ставьте товар на полки, принимайте посылки и не пропускайте аномалии.",
            "authors": ["Claude"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.midnightmall.MidnightMall"],
              "client": ["com.midnightmall.MallClient"]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": ">=1.21 <=1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          MALL_EOF_7Q

      - name: Write project (Java sources)
        run: |
          set -e
          cd _mall
          cat > src/main/java/com/midnightmall/Fx.java <<'MALL_EOF_7Q'
          package com.midnightmall;

          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.registry.entry.RegistryEntry;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvent;

          /** Мелкие помощники для звуков (принимают и SoundEvent, и RegistryEntry). */
          public final class Fx {
              private Fx() {}

              public static void sound(ServerWorld w, double x, double y, double z, Object sound, float vol, float pitch) {
                  SoundEvent ev;
                  if (sound instanceof SoundEvent se) {
                      ev = se;
                  } else {
                      ev = (SoundEvent) ((RegistryEntry<?>) sound).value();
                  }
                  w.playSound((PlayerEntity) null, x, y, z, ev, SoundCategory.AMBIENT, vol, pitch);
              }
          }
          MALL_EOF_7Q
          cat > src/main/java/com/midnightmall/MallBuilder.java <<'MALL_EOF_7Q'
          package com.midnightmall;

          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.block.HorizontalFacingBlock;
          import net.minecraft.block.StairsBlock;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.World;

          import java.util.ArrayList;
          import java.util.List;

          /** Геометрия и генерация торгового центра. Всё строится кодом, ресурсов не нужно. */
          public final class MallBuilder {
              private MallBuilder() {}

              // Размер: x 0..79, z 0..59. Три уровня: подвал (склад), 1 этаж (магазин, галерея), 2 этаж.
              public static final int X1 = 79, Z1 = 59;
              // слои пола/потолка (поверхность ходьбы = +1): подвал 57, этаж 64, второй этаж 72
              public static final int YB = 56, CB = 62, YG = 63, CG = 70, YF = 71, CF = 78;
              private static final int F = Block.NOTIFY_LISTENERS;

              public static final Vec3d SPAWN = new Vec3d(39.5, 64, 16.5);
              public static final Vec3d DOOR_A = new Vec3d(76.5, 64, 26.5);
              public static final Vec3d DOOR_B = new Vec3d(76.5, 64, 33.5);
              public static final BlockPos REGISTER = new BlockPos(39, 65, 18);
              public static final BlockPos PHONE = new BlockPos(41, 65, 18);
              public static final BlockPos[] BREAKER = {new BlockPos(45, 58, 58), new BlockPos(45, 59, 58)};
              public static final BlockPos[] DOCK = {
                      new BlockPos(68, 57, 5), new BlockPos(70, 57, 5), new BlockPos(72, 57, 5), new BlockPos(74, 57, 5)
              };

              /** Полка: ряд блоков x1..x2 на линии z, покупатель подходит с стороны dz. */
              public record Shelf(int x1, int x2, int z, int dz) {
                  public Vec3d approach() {
                      return new Vec3d(x1 + (x2 - x1 + 1) / 2.0, 64, z + dz + 0.5);
                  }

                  public boolean contains(BlockPos p) {
                      return p.getZ() == z && p.getX() >= x1 && p.getX() <= x2 && p.getY() >= 64 && p.getY() <= 65;
                  }

                  public Direction facing() {
                      return dz > 0 ? Direction.SOUTH : Direction.NORTH;
                  }
              }

              public static final List<Shelf> SHELVES = new ArrayList<>();
              public static final List<BlockPos> LIGHTS = new ArrayList<>();
              public static final List<BlockPos> EMERGENCY = new ArrayList<>();

              static {
                  int[][] four = {{31, 34}, {36, 39}, {41, 44}, {46, 49}};
                  int[][] three = {{31, 34}, {36, 39}, {41, 44}};
                  for (int[] r : four) SHELVES.add(new Shelf(r[0], r[1], 2, 1));
                  for (int[] r : three) SHELVES.add(new Shelf(r[0], r[1], 7, 1));
                  for (int[] r : three) SHELVES.add(new Shelf(r[0], r[1], 13, -1));

                  int[] ys = {CB, CG, CF};
                  for (int y : ys) {
                      for (int ix = 0; ix < 10; ix++) {
                          for (int iz = 0; iz < 7; iz++) {
                              BlockPos p = new BlockPos(4 + ix * 8, y, 4 + iz * 8);
                              if ((ix + iz) % 3 == 0) EMERGENCY.add(p);
                              else LIGHTS.add(p);
                          }
                      }
                  }
              }

              /** Точки появления «Смотрящего»: [0] подвал, [1] 1 этаж, [2] 2 этаж. */
              public static final Vec3d[][] WATCH_SPOTS = {
                      {new Vec3d(24.5, 57, 33.5), new Vec3d(54.5, 57, 34.5), new Vec3d(34.5, 57, 28.5), new Vec3d(14.5, 57, 45.5)},
                      {new Vec3d(20.5, 64, 28.5), new Vec3d(30.5, 64, 33.5), new Vec3d(48.5, 64, 28.5), new Vec3d(60.5, 64, 33.5)},
                      {new Vec3d(20.5, 72, 29.5), new Vec3d(48.5, 72, 29.5), new Vec3d(60.5, 72, 26.5), new Vec3d(30.5, 72, 33.5)}
              };

              public static int floorOf(double y) {
                  if (y < 62) return 0;
                  if (y < 70) return 1;
                  return 2;
              }

              // ---------- вспомогательные ----------

              private static void set(World w, int x, int y, int z, BlockState s) {
                  w.setBlockState(new BlockPos(x, y, z), s, F);
              }

              private static void fill(World w, int x1, int y1, int z1, int x2, int y2, int z2, BlockState s) {
                  BlockPos.Mutable m = new BlockPos.Mutable();
                  for (int x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                      for (int y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                          for (int z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) {
                              m.set(x, y, z);
                              w.setBlockState(m, s, F);
                          }
                      }
                  }
              }

              private static void hollow(World w, int x1, int z1, int x2, int z2, int y1, int y2, BlockState s) {
                  fill(w, x1, y1, z1, x2, y2, z1, s);
                  fill(w, x1, y1, z2, x2, y2, z2, s);
                  fill(w, x1, y1, z1, x1, y2, z2, s);
                  fill(w, x2, y1, z1, x2, y2, z2, s);
              }

              private static void tiles(World w, int y, BlockState a, BlockState b) {
                  BlockPos.Mutable m = new BlockPos.Mutable();
                  for (int x = 0; x <= X1; x++) {
                      for (int z = 0; z <= Z1; z++) {
                          m.set(x, y, z);
                          w.setBlockState(m, (((x >> 1) + (z >> 1)) & 1) == 0 ? a : b, F);
                      }
                  }
              }

              private static BlockState face(BlockState st, Direction d) {
                  return st.contains(HorizontalFacingBlock.FACING) ? st.with(HorizontalFacingBlock.FACING, d) : st;
              }

              // ---------- свет ----------

              public static void setLights(ServerWorld w, boolean on) {
                  BlockState s = on ? Blocks.OCHRE_FROGLIGHT.getDefaultState() : Blocks.GRAY_CONCRETE.getDefaultState();
                  for (BlockPos p : LIGHTS) {
                      w.setBlockState(p, s, F);
                  }
              }

              // ---------- полки ----------

              public static void refreshShelf(ServerWorld w, int idx, int stock) {
                  Shelf s = SHELVES.get(idx);
                  BlockState st = stock > 0
                          ? Blocks.BOOKSHELF.getDefaultState()
                          : face(Blocks.CHISELED_BOOKSHELF.getDefaultState(), s.facing());
                  for (int x = s.x1(); x <= s.x2(); x++) {
                      for (int y = 64; y <= 65; y++) {
                          w.setBlockState(new BlockPos(x, y, s.z()), st, F);
                      }
                  }
              }

              // ---------- генерация ----------

              public static void build(ServerWorld w) {
                  BlockState concrete = Blocks.WHITE_CONCRETE.getDefaultState();
                  BlockState ceil = Blocks.LIGHT_GRAY_CONCRETE.getDefaultState();
                  BlockState tileA = Blocks.WHITE_TERRACOTTA.getDefaultState();
                  BlockState tileB = Blocks.LIGHT_GRAY_TERRACOTTA.getDefaultState();
                  BlockState dark = Blocks.GRAY_CONCRETE.getDefaultState();
                  BlockState brick = Blocks.STONE_BRICKS.getDefaultState();

                  // перекрытия
                  fill(w, 0, YB, 0, X1, YB, Z1, dark);
                  fill(w, 0, CB, 0, X1, CB, Z1, ceil);
                  tiles(w, YG, tileA, tileB);
                  fill(w, 0, CG, 0, X1, CG, Z1, ceil);
                  tiles(w, YF, tileA, tileB);
                  fill(w, 0, CF, 0, X1, CF, Z1, ceil);

                  // внешние стены
                  hollow(w, 0, 0, X1, Z1, YB + 1, CB - 1, brick);
                  hollow(w, 0, 0, X1, Z1, YG + 1, CG - 1, concrete);
                  hollow(w, 0, 0, X1, Z1, YF + 1, CF - 1, concrete);

                  partitions(w, YG, true);
                  partitions(w, YF, false);
                  warehouse(w);
                  store(w);
                  stairs(w);

                  // стеклянный вход (за ним темнота)
                  fill(w, 79, 64, 26, 79, 67, 33, Blocks.GLASS.getDefaultState());

                  // аварийные (всегда горят) и обычные светильники
                  for (BlockPos p : EMERGENCY) {
                      w.setBlockState(p, Blocks.CRYING_OBSIDIAN.getDefaultState(), F);
                  }
                  setLights(w, true);
              }

              private static void partitions(ServerWorld w, int floorY, boolean shops) {
                  int y1 = floorY + 1;
                  int y2 = floorY + 6;
                  BlockState wall = Blocks.WHITE_CONCRETE.getDefaultState();
                  BlockState air = Blocks.AIR.getDefaultState();

                  int[] divs = {14, 28, 51, 65};
                  for (int x : divs) {
                      fill(w, x, y1, 1, x, y2, 22, wall);
                      fill(w, x, y1, 37, x, y2, 58, wall);
                  }
                  fill(w, 1, y1, 23, X1 - 1, y2, 23, wall);
                  fill(w, 1, y1, 36, X1 - 1, y2, 36, wall);

                  int[][] gapsN = {{6, 9}, {19, 22}, {36, 43}, {56, 59}, {70, 73}};
                  int[][] gapsS = {{6, 9}, {19, 22}, {34, 45}, {56, 59}, {70, 73}};
                  for (int[] g : gapsN) fill(w, g[0], y1, 23, g[1], y2, 23, air);
                  for (int[] g : gapsS) fill(w, g[0], y1, 36, g[1], y2, 36, air);

                  // колонны галереи
                  int[] cx = {20, 32, 47, 59};
                  int[] cz = {26, 33};
                  for (int x : cx) {
                      for (int z : cz) {
                          fill(w, x, y1, z, x, y2, z, Blocks.QUARTZ_PILLAR.getDefaultState());
                      }
                  }

                  if (shops) {
                      Block[] carpets = {
                              Blocks.RED_CARPET, Blocks.BLUE_CARPET, Blocks.GREEN_CARPET, Blocks.PURPLE_CARPET,
                              Blocks.CYAN_CARPET, Blocks.ORANGE_CARPET, Blocks.PINK_CARPET, Blocks.YELLOW_CARPET,
                              Blocks.MAGENTA_CARPET
                      };
                      BlockState books = Blocks.BOOKSHELF.getDefaultState();
                      int k = 0;
                      int[][] north = {{1, 13}, {15, 27}, {52, 64}, {66, 78}};
                      for (int[] r : north) {
                          fill(w, r[0], y1, 1, r[1], y1, 22, carpets[k++ % carpets.length].getDefaultState());
                          fill(w, r[0] + 1, y1, 1, r[1] - 1, y1 + 1, 1, books);
                      }
                      int[][] south = {{1, 13}, {15, 27}, {52, 64}, {66, 78}};
                      for (int[] r : south) {
                          fill(w, r[0], y1, 37, r[1], y1, 58, carpets[k++ % carpets.length].getDefaultState());
                          fill(w, r[0] + 1, y1, 58, r[1] - 1, y1 + 1, 58, books);
                      }
                      // фудкорт (юг, центр): столики
                      for (int x = 32; x <= 48; x += 4) {
                          for (int z = 42; z <= 54; z += 4) {
                              set(w, x, 64, z, Blocks.OAK_FENCE.getDefaultState());
                              set(w, x, 65, z, Blocks.OAK_PRESSURE_PLATE.getDefaultState());
                          }
                      }
                  }
              }

              private static void warehouse(ServerWorld w) {
                  BlockState plank = Blocks.SPRUCE_PLANKS.getDefaultState();
                  BlockState barrel = Blocks.BARREL.getDefaultState();
                  int[] rows = {10, 16, 22, 40, 46, 52};
                  int[][] segs = {{16, 22}, {26, 32}, {36, 42}, {46, 52}, {56, 62}};
                  for (int z : rows) {
                      for (int[] s : segs) {
                          fill(w, s[0], 57, z, s[1], 58, z, plank);
                          for (int x = s[0]; x <= s[1]; x += 2) {
                              set(w, x, 59, z, barrel);
                          }
                      }
                  }
                  // погрузочная зона
                  fill(w, 66, YB, 3, 76, YB, 8, Blocks.YELLOW_CONCRETE.getDefaultState());
                  // щиток
                  for (BlockPos p : BREAKER) {
                      w.setBlockState(p, Blocks.IRON_BLOCK.getDefaultState(), F);
                  }
                  set(w, 44, 59, 58, Blocks.CRYING_OBSIDIAN.getDefaultState());
                  set(w, 46, 59, 58, Blocks.CRYING_OBSIDIAN.getDefaultState());
              }

              private static void store(ServerWorld w) {
                  fill(w, 29, YG, 1, 50, YG, 22, Blocks.BIRCH_PLANKS.getDefaultState());
                  // витрина
                  for (int x = 29; x <= 50; x++) {
                      if (x >= 36 && x <= 43) continue;
                      fill(w, x, 64, 23, x, 67, 23, Blocks.GLASS.getDefaultState());
                  }
                  // прилавок, касса, телефон
                  fill(w, 36, 64, 18, 43, 64, 18, Blocks.QUARTZ_BLOCK.getDefaultState());
                  w.setBlockState(REGISTER, face(Blocks.LECTERN.getDefaultState(), Direction.SOUTH), F);
                  w.setBlockState(PHONE, Blocks.BELL.getDefaultState(), F);
                  for (int i = 0; i < SHELVES.size(); i++) {
                      refreshShelf(w, i, 2);
                  }
              }

              private static void stairs(ServerWorld w) {
                  BlockState brick = Blocks.STONE_BRICKS.getDefaultState();
                  BlockState air = Blocks.AIR.getDefaultState();
                  BlockState bars = Blocks.IRON_BARS.getDefaultState();
                  BlockState st = Blocks.STONE_BRICK_STAIRS.getDefaultState().with(StairsBlock.FACING, Direction.EAST);

                  // ВНИЗ (в подвал): x 12 -> 6, z 29..31
                  fill(w, 6, CB, 29, 12, YG, 31, air);
                  for (int i = 0; i <= 6; i++) {
                      int x = 12 - i;
                      int y = 63 - i;
                      for (int z = 29; z <= 31; z++) {
                          if (y - 1 >= 57) fill(w, x, 57, z, x, y - 1, z, brick);
                          set(w, x, y, z, st);
                      }
                  }
                  for (int x = 6; x <= 12; x++) {
                      for (int y = 64; y <= 65; y++) {
                          w.setBlockState(new BlockPos(x, y, 28), bars, Block.NOTIFY_ALL);
                          w.setBlockState(new BlockPos(x, y, 32), bars, Block.NOTIFY_ALL);
                      }
                  }
                  for (int z = 29; z <= 31; z++) {
                      for (int y = 64; y <= 65; y++) {
                          w.setBlockState(new BlockPos(5, y, z), bars, Block.NOTIFY_ALL);
                      }
                  }

                  // ВВЕРХ (на 2 этаж): x 66 -> 73, z 29..31
                  fill(w, 66, CG, 29, 73, YF, 31, air);
                  for (int i = 0; i <= 7; i++) {
                      int x = 66 + i;
                      int y = 64 + i;
                      for (int z = 29; z <= 31; z++) {
                          if (y - 1 >= 64) fill(w, x, 64, z, x, y - 1, z, brick);
                          set(w, x, y, z, st);
                      }
                  }
                  for (int x = 66; x <= 73; x++) {
                      for (int y = 72; y <= 73; y++) {
                          w.setBlockState(new BlockPos(x, y, 28), bars, Block.NOTIFY_ALL);
                          w.setBlockState(new BlockPos(x, y, 32), bars, Block.NOTIFY_ALL);
                      }
                  }
                  for (int z = 29; z <= 31; z++) {
                      for (int y = 72; y <= 73; y++) {
                          w.setBlockState(new BlockPos(65, y, z), bars, Block.NOTIFY_ALL);
                      }
                  }
              }
          }
          MALL_EOF_7Q
          cat > src/main/java/com/midnightmall/MallClient.java <<'MALL_EOF_7Q'
          package com.midnightmall;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.EntityRendererRegistry;

          public class MallClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  EntityRendererRegistry.register(MallEntities.NPC, MallNpcRenderer::new);
              }
          }
          MALL_EOF_7Q
          cat > src/main/java/com/midnightmall/MallCommands.java <<'MALL_EOF_7Q'
          package com.midnightmall;

          import com.mojang.brigadier.CommandDispatcher;
          import com.mojang.brigadier.arguments.BoolArgumentType;
          import com.mojang.brigadier.arguments.IntegerArgumentType;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.minecraft.command.CommandRegistryAccess;
          import net.minecraft.command.CommandSource;
          import net.minecraft.server.command.CommandManager;
          import net.minecraft.server.command.ServerCommandSource;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.text.Text;

          import java.util.Arrays;

          public final class MallCommands {
              private MallCommands() {}

              public static void register(CommandDispatcher<ServerCommandSource> d, CommandRegistryAccess access,
                                          CommandManager.RegistrationEnvironment env) {
                  d.register(CommandManager.literal("mall")
                          .then(CommandManager.literal("join").executes(c -> {
                              MallManager.join(c.getSource().getPlayerOrThrow());
                              return 1;
                          }))
                          .then(CommandManager.literal("leave").executes(c -> {
                              ServerPlayerEntity p = c.getSource().getPlayerOrThrow();
                              if (MallManager.inMall(p)) MallManager.leave(p);
                              return 1;
                          }))
                          .then(CommandManager.literal("rules").executes(c -> {
                              MallManager.rules(c.getSource().getPlayerOrThrow());
                              return 1;
                          }))
                          .then(CommandManager.literal("status").executes(c -> {
